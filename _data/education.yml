    ## MSc in Applied & Computational Mathematics 
    ---
    * Average grade: 8.38/10 with 1 Honorable Mention on **Advanced Methods in Analysis**.

    * Course work: Biological Inspired Artificial Intelligence, Modelling and Nonlinear Analysis, Optimization, Stochastic Equations for Finance and Biology, Complex Biological and Socioeconomic systems, Computational Linear Algebra, Computational techniques for Differential equations, Methods for Nonlinear differential equations, Applied discrete mathematics.

    * Master's Description: The Master's Degree in Computational and Applied Mathematics offered by Universidad Carlos III de Madrid responds to such a demand, by emphasizing a double, computational and mathematical, approach to solving realistic problems, offering multidisciplinar education to holders of STEM Bachelor degrees which, from a solid basic training, is oriented towards the development of quantitative and computational methods which can be applied to a wide spectrum of disciplines.

