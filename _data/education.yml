    ## BSc in Mathematics and Computer Science
    ---
    * Average grade: 9.4/10 with 14 Honorable Mentions.

    * Courses: Databases, Operative Systems, Data Structures, Data Analytics, Artificial Intelligence, Programming (Object Oriented, imperative, functional and logic), Functional Analysis, Applied & Computational Topology and Pure Mathematics.

    * Degree Description: The ultimate purpose of the degree is to know the nature, methods, and most relevant purposes of Mathematics, and to have general knowledge of Computer Science and the interrelation between both disciplines. 
                          Companies in the I.T. sector, such as IBM, have noted the growing demand for professionals with good knowledge of computing and mathematics, who can also serve as a link between experts in the two disciplines.

