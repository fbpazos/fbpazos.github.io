  Alongside my interests in mathematics and computer science some of my other interests and hobbies are:
  ## Violin
  ---
  With 4 years of experience playing the violin and daily practice of 2 hours per day, I have honed my skills in instrument playing, musical notation reading, and completed additional coursework in music theory.

  As a member of an orchestra, I participated in the European Youth Music Week 2022 in Oakham, United Kingdom as well as in E.Y.M.W 2023 Sonderhausen, Germany.

  * **Concerts**
  * Partita II (BWV 1004) Allemande - J.S. Bach (June 2022): [https://www.youtube.com/watch?v=sUpG7nl1QDQ](https://www.youtube.com/watch?v=sUpG7nl1QDQ) 
  * Sonata for Violin & Piano (KV. 304) - W.A. Mozart (June 2022): [https://www.youtube.com/watch?v=WOvARdlh45Q](https://www.youtube.com/watch?v=WOvARdlh45Q)
  * Salut d'Amour (to Carice) - Edward Elgar (December 2022): [youtube.com/watch?v=Bhm1K_2bTYQ](https://www.youtube.com/watch?v=Bhm1K_2bTYQ)
  * Double Violin Concerto (BWV 1043) - J.S. Bach (June 2022): [youtube.com/watch?v=j81yxB_dy_E](https://www.youtube.com/watch?v=j81yxB_dy_E)
  * Opus 34, First Movement - Oskar Rieding (December 2021): [youtube.com/watch?v=35g-lyy-INw](https://www.youtube.com/watch?v=35g-lyy-INw)

  ## Swimming
  ---
  I have a commitment to maintaining a healthy and active lifestyle and prioritize regular physical activity, including swimming at least once a week. With 5 years of experience in the sport, I have developed strong swimming skills and the ability to swim for longer periods of time with endurance.
  Actively training for a 5km sea swimming semi-marathon aimed at supporting individuals with ALS, demonstrating commitment to personal health, endurance sports, and philanthropic efforts to make a meaningful difference in the community.
