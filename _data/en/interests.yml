  Alongside my passion for mathematics and artificial intelligence, I channel deep discipline, creativity, and relentless drive through athletics and the arts:

  ## CrossFit & High-Performance Fitness
  ---
  A dedicated CrossFit athlete focused on functional strength, metabolic conditioning, and peak physical resilience. I thrive in high-intensity environments that push mental and cardiovascular limits—treating physical discipline as the foundation for cognitive focus and engineering problem-solving.

  * **Competitive Races & Fitness Challenges:**
    * <mark>Spartan Race</mark> — Obstacle Course Racing (OCR) demanding total endurance, agility, and grit.
    * <mark>Hyrox Bilbao</mark> — Global functional fitness competition combining 8 km running with 8 functional workout stations.
    * <mark>Deka Fit Madrid</mark> & <mark>Deka Fit Zaragoza</mark> — Decathlon of functional fitness testing multi-domain athletic capacity.

  ## Violin & Classical Music
  ---
  With over 4 years of dedicated study and 2 hours of daily practice, I have cultivated advanced violin technique, orchestral performance experience, and music theory rigor.

  As an orchestral violinist, I had the honor of performing internationally at the **European Youth Music Week (EYMW) 2022** in Oakham (United Kingdom) and **EYMW 2023** in Sondershausen (Germany).

  * **Featured Performances & Concert Recordings:**
    * *Partita II (BWV 1004) Allemande* — J.S. Bach (June 2022): [Watch on YouTube](https://www.youtube.com/watch?v=sUpG7nl1QDQ)
    * *Sonata for Violin & Piano (KV. 304)* — W.A. Mozart (June 2022): [Watch on YouTube](https://www.youtube.com/watch?v=WOvARdlh45Q)
    * *Salut d'Amour (to Carice)* — Edward Elgar (December 2022): [Watch on YouTube](https://www.youtube.com/watch?v=Bhm1K_2bTYQ)
    * *Double Violin Concerto (BWV 1043)* — J.S. Bach (June 2022): [Watch on YouTube](https://www.youtube.com/watch?v=j81yxB_dy_E)
    * *Opus 34, First Movement* — Oskar Rieding (December 2021): [Watch on YouTube](https://www.youtube.com/watch?v=35g-lyy-INw)

  ## Swimming & Philanthropy
  ---
  Swimming has been an essential pillar of my lifestyle for over 5 years, fostering aerobic capacity, mental clarity, and athletic endurance.

  * **Open Water & Community Impact**: Actively training for a **5 km open sea swimming semi-marathon** in support of ALS (Amyotrophic Lateral Sclerosis) research and patient advocacy—uniting endurance sports with meaningful social impact.
