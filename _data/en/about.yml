content: |
  I am an **AI Engineer & Technical Leader** with a double background in **Mathematics and Computer Science** (UPM, GPA 9.4/10) and an **MSc in Applied & Computational Mathematics** (UC3M). I bridge mathematical rigor with cloud-native engineering to design deterministic, enterprise-grade AI platforms that solve high-stakes operational challenges.

  Currently at **DXC Technology**, I lead engineering initiatives spanning **Multi-Agent orchestration** (AutoGen, Google ADK, MCP), deterministic Generative AI presales pipelines (>95% cycle-time reduction), and automated SOX compliance audit systems. Trusted by enterprise clients and cross-functional teams, I specialize in translating complex business requirements into inspectable, high-throughput AI architectures with strict quality gates and zero-tolerance governance.

  Beyond engineering, I cultivate relentless discipline and mental endurance through competitive athletics (<mark>CrossFit</mark>, <mark>Spartan Race</mark>, <mark>Hyrox</mark>, and open-water marathon swimming) and 4+ years as an international orchestral violinist.

  **Core Expertise:** <mark>Multi-Agent Systems</mark> <mark>Generative AI & LLM Architecture</mark> <mark>Applied Mathematics</mark> <mark>Azure Cloud Architecture</mark> <mark>Python</mark> <mark>Enterprise Governance & MLOps</mark>
