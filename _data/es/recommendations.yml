- layout: left
  title: Andrés Cabrera López
  sub_title: Responsable de Digital Delivery · Ferrovial
  caption: Agosto 2026
  link: files/recommendations/Carta_Recomendacion_Andres_Cabrera_Ferrovial.pdf
  link_text: Ver Carta de Recomendación (PDF)
  description: |
    > *"Fernando ha demostrado una talla profesional que va mucho más allá de la ejecución técnica. Desde el primer día destacó por su proactividad y su capacidad para proponer ideas que aportaban valor real, anticipándose a necesidades que ni siquiera se habían planteado formalmente. Uno de los aspectos más valiosos de su contribución fue hacerse cargo de un producto que llegó en un estado muy deficiente: asumió el reto con determinación y criterio, y lo transformó en una solución plenamente operativa y fiable que se ganó la confianza directa del sponsor del proyecto. En las reuniones, su capacidad para moderar, estructurar el debate y reconducir discusiones complejas fue un activo fundamental. Le recomiendo sin reservas para cualquier posición que requiera no solo solvencia técnica, sino también liderazgo y visión."*

    * **Alcance y Proyecto**: Liderazgo y arquitectura principal en la iniciativa **autoSOX**.
    * **Puntos Clave del Aval**: Gestión excepcional de stakeholders, recuperación integral de producto y liderazgo técnico.

- layout: left
  title: Andrés Reeve Crespo
  sub_title: Gerente de Control Interno · Ferrovial
  caption: Agosto 2026
  link: files/recommendations/Carta_Recomendacion_Andres_Reeve_Ferrovial.pdf
  link_text: Ver Carta de Recomendación (PDF)
  description: |
    > *"Me gustaría destacar especialmente su solvencia técnica y funcional, traduciendo requisitos exigentes de control interno en soluciones estables, bien documentadas y alineadas con los criterios de auditoría. Su disponibilidad y predisposición para ayudar —en particular durante los momentos más intensos del calendario de auditorías SOX— siempre respondieron con seriedad y compromiso. Su aportación tuvo un impacto real en el resultado del proyecto y demostró que puede asumir responsabilidades mayores a las previstas inicialmente."*

    * **Alcance y Proyecto**: **Auto SOX** (Validación y pruebas automatizadas de controles SOX).
    * **Puntos Clave del Aval**: Solvencia técnica, mejoras funcionales proactivas y alta fiabilidad en periodos de pico de auditoría.

- layout: left
  title: María Vega Laguna Díaz
  sub_title: Científica de Datos (Digital Hub) · Ferrovial
  caption: Junio 2026
  description: |
    > *"Fernando es resolutivo y gestiona las prioridades de manera eficaz. Ha dado un salto cualitativo significativo a lo largo de iniciativas como Contract Management, Lane Closure y AutoSOX, pasando de ser un perfil puramente técnico a convertirse en una referencia para el equipo de negocio. Tiene una notable capacidad para escuchar las necesidades de negocio, comprenderlas y traducirlas con éxito a la implementación técnica, aportando un gran valor. Su trabajo va mucho más allá de las funciones estándar de un ingeniero de IA, demostrando las capacidades necesarias para mantener una visión integral de los proyectos."*

    * **Alcance e Iniciativas**: **AutoSOX**, **Lane Closure** y **Contract Management** (Digital Hub de Ferrovial).
    * **Puntos Clave del Aval**: Traducción de negocio a tecnología, versatilidad transversal y liderazgo funcional.
