    - title: Innovador de Sistemas
      summary: Impulsé la investigación y desarrollo en Gemelos Digitales (Autodesk Tandem y Azure IoT), sistemas internos de RAG, clasificación NLP con BERT e infraestructura dockerizada de desarrollo de IA.
      details: |
        * **PoC Gemelo Digital**: Desarrollé una Prueba de Concepto de Gemelo Digital utilizando Autodesk Tandem y Azure IoT Hub, en conjunto con Azure Stream Analytics y Azure ML Studio, demostrando capacidades predictivas superiores a los métodos de monitorización tradicionales.
        * **RAG Interno y Asistente IA**: Dirigí el I+D teórico de un innovador sistema interno de Generación Aumentada por Recuperación (RAG), mejorando la comprensión del lenguaje y creando un asistente corporativo basado en LLMs.
        * **Clasificación NLP con BERT**: Desarrollé un clasificador de IA utilizando NLP y el modelo BERT de Google, complementado con ontologías para categorización avanzada a partir de descripciones de proyectos.
        * **Generador Automatizado de CVs**: Innové un generador de currículums integrado con el sistema interno Success Factors de S&P, abarcando ingesta de datos, redacción generativa determinista y compilación de plantillas.
        * **Infraestructura de IA**: Arquitecté y desplegué una infraestructura de desarrollo de IA contenerizada en Docker con monitorización de recursos en tiempo real, enrutamiento con Traefik y herramientas como Stable Diffusion.

    - title: Consultoría – Transformación Digital
      summary: Desarrollé pipelines automatizados de datos tabulares con Azure Document Intelligence y Phi-3.5 para SAP, modelos predictivos de mantenimiento de activos y metodologías de valoración catastral.
      details: |
        * **Pipeline de Datos SAP**: Desarrollé un pipeline automatizado con Azure Document Intelligence y Azure Phi-3.5 para estructurar datos tabulares bajo convenciones de nomenclatura de SAP, reduciendo el tiempo de procesado y mejorando la consistencia.
        * **Mantenimiento Inteligente de Activos**: Lideré el desarrollo de modelos matemáticos y de IA para transformar el mantenimiento de activos de reactivo a proactivo mediante módulos IoT y Gestión Inteligente de S&P.
        * **Valoración Estadística Catastral**: Desempeñé un rol clave como Estadístico colaborando con la oficina de registro, creando un método de cálculo para la valoración de inmuebles en el País Vasco.

