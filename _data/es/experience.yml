- layout: left
  title: AI Engineer & Technical Leader
  company: DXC Technology
  link: https://dxc.com/es
  link_text: DXC.com
  sub_title: Zaragoza, España
  caption: Ene. 2025 – Sept. 2026
  roles:
    - title: AI Solutions Engineer - GenAI & Arquitectura
      summary: Lideré el análisis funcional, la arquitectura y el desarrollo integral de un pipeline empresarial de IA Generativa para acelerar la preventa técnica, reemplazando el análisis manual de licitaciones (RFP) por un sistema determinista de extracción estructurada y auditoría multi-agente (>95% de ahorro de tiempo).
      details: |
        * **Arquitectura y Ciclo de Vida**: Mapeé el ciclo de vida de la oportunidad en 8 etapas (Fases 0–7) y diseñé un conjunto modular de 9 capacidades para mitigar riesgos críticos, incluyendo penalizaciones ocultas, inconsistencias de tono/estilo y descalificación de ofertas por cruce de sobres.
        * **Extracción Determinista (Schema-First)**: Desarrollé un motor basado en LLMs de contexto amplio y parsing documental estructurado (Docling/PyMuPDF). Bypaseé el RAG vectorial en favor de contratos de datos estrictos y autorreparables con Pydantic v2, estructurando más de 450 elementos con trazabilidad completa y citas textuales.
        * **Evaluación Multi-Agente**: Diseñé un comité de revisión virtual (Árbitro Neutral junto a evaluadores de riesgo técnico y financiero) para auditar propuestas de más de 150 páginas contra especificaciones de pliegos, emitiendo veredictos cláusula por cláusula con justificación detallada y evidencia textual.
        * **Gobernanza y Human-in-the-Loop**: Implementé un entorno de ejecución inspeccionable con puertas de calidad (Gate M4), aislamiento en nube empresarial (políticas de cero entrenamiento de datos) y registro de auditoría de extremo a extremo.
        * **Impacto y Validación Empírica**: Validé el MVP en licitaciones reales (RFP de 34 páginas vs. propuesta de 153 páginas), reduciendo la generación de matrices de cumplimiento de 16–47 horas a menos de 10 minutos (>95% de ahorro de tiempo) con 100% de cobertura en más de 320 requisitos (<7% de varianza).

    - title: Sistema de Auditoría de IA
      summary: Líder de entrega técnica para una solución agéntica de auditoría de cumplimiento SOX construida con Google ADK, proporcionando validación automatizada de evidencias para Control Owners y reduciendo significativamente la carga de auditoría.
      details: |
        * **Liderazgo Técnico**: Lideré la entrega técnica, gestionando desarrolladores y coordinando con la gestión de proyectos mientras desarrollaba la solución principal de IA.
        * **Análisis Agéntico de Evidencias**: Construí el sistema agéntico utilizando Google ADK para analizar evidencias de auditoría subidas (múltiples formatos y tamaños) y determinar su suficiencia frente a los controles SOX.
        * **Validación Previa a la Entrega**: Generé informes detallados analizados por IA para los Control Owners, proporcionando una validación previa a la presentación que antes no estaba disponible.
        * **Reducción de Costes y Esfuerzo**: Reduje significativamente el tiempo de los auditores para la verificación de evidencias, logrando importantes ahorros de costes al minimizar los recursos de auditoría necesarios.
        * **Calidad del Cumplimiento**: Doté a los Control Owners de un inventario preciso y una verificación de validación, agilizando la preparación de evidencias y mejorando la calidad del cumplimiento normativo.

    - title: Liderazgo de Plataforma de IA Empresarial
      summary: Dirigí equipos multidisciplinares para diseñar y desplegar una plataforma de IA multi-agente basada en Microsoft AutoGen sobre Azure, gestionando microservicios y pipelines de datos en tiempo real procesando más de 1M de registros.
      details: |
        * **Arquitectura Multi-Agente**: Lideré equipos multidisciplinares para diseñar y lanzar una plataforma de IA multi-agente basada en Microsoft AutoGen, gestionando microservicios y arquitectura nativa en la nube sobre Azure.
        * **Agentes Inteligentes**: Diseñé agentes inteligentes (geoespaciales, siniestros, automatización de decisiones) a escala empresarial utilizando Azure OpenAI GPT-4o.
        * **Pipelines Basados en Eventos**: Diseñé pipelines de datos basados en eventos (Azure EventHub, 99.9% de fiabilidad), procesando más de 1M de registros.
        * **Hoja de Ruta y Despliegue**: Asumí la responsabilidad de entrega integral desde la hoja de ruta técnica hasta el despliegue en producción empresarial.
        * **DevOps y Validación de Modelos**: Construí pipelines de CI/CD, automatización de DevOps y marcos de validación de modelos de IA para sistemas de producción escalables.
        * **Mentoría de Equipos**: Impartí mentoría a los equipos en IA avanzada, orquestación multi-agente y entornos de ejecución seguros.

    - title: Plataforma Agéntica de Gestión y Automatización de Tráfico
      summary: Arquitecté e implementé un motor de planificación geoespacial multi-agente para automatizar esquemas temporales de gestión de tráfico a partir de solicitudes de obras viarias, utilizando Google ADK, Agent2Agent, MCP, PostgreSQL y Kubernetes.
      details: |
        * **Motor de Planificación Geoespacial**: Diseñé e implementé un motor de planificación geoespacial multi-agente para automatizar diseños temporales de gestión de tráfico a partir de solicitudes de obras viarias, utilizando Google ADK, Agent2Agent, MCP, PostgreSQL, Azure y Kubernetes.
        * **Capa de Orquestación**: Construí una capa de orquestación que coordina agentes especializados y herramientas MCP compartidas, garantizando flujos de trabajo deterministas y auditables con una clara separación entre lógica de negocio, normativas y computación geoespacial.
        * **Integración Empresarial**: Integré la plataforma con los sistemas empresariales existentes (incluyendo CRM y herramientas de gestión de obras) mediante adaptadores dedicados, permitiendo la automatización integral desde la recepción de la solicitud hasta los planos de tráfico listos para su despliegue.
        * **Estandarización y Calidad**: Mejoré la velocidad de entrega y la coherencia de los diseños de gestión de tráfico al estandarizar los cálculos, reduciendo el esfuerzo de configuración manual y disminuyendo el riesgo de error humano en la definición de esquemas.

- layout: left
