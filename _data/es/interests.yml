  Junto a mi pasión por las matemáticas y la inteligencia artificial, canalizo una profunda disciplina, creatividad y superación personal a través del deporte de alto rendimiento y las artes:

  ## CrossFit y Fitness de Alto Rendimiento
  ---
  Atleta de CrossFit enfocado en fuerza funcional, acondicionamiento metabólico y resiliencia física. Busco entornos de alta exigencia que ponen a prueba los límites cardiovasculares y mentales, entendiendo la disciplina física como el pilar fundamental para el enfoque cognitivo y la resolución de problemas de ingeniería.

  * **Competiciones y Carreras de Resistencia:**
    * <mark>Spartan Race</mark> — Carrera de obstáculos (OCR) que exige resistencia total, agilidad y determinación.
    * <mark>Hyrox Bilbao</mark> — Competición global de fitness funcional que combina 8 km de carrera con 8 estaciones de ejercicios funcionales.
    * <mark>Deka Fit Madrid</mark> y <mark>Deka Fit Zaragoza</mark> — Decatlón de fitness funcional que evalúa la capacidad atlética multidominio.

  ## Violín y Música Clásica
  ---
  Con más de 4 años de estudio y una práctica diaria de 2 horas, he desarrollado una técnica violinística avanzada, experiencia en interpretación orquestal y rigor en teoría musical.

  Como violinista de orquesta, tuve el honor de participar a nivel internacional en la **European Youth Music Week (EYMW) 2022** en Oakham (Reino Unido) y en **EYMW 2023** en Sondershausen (Alemania).

  * **Conciertos y Grabaciones Destacadas:**
    * *Partita II (BWV 1004) Allemande* — J.S. Bach (Junio 2022): [Ver en YouTube](https://www.youtube.com/watch?v=sUpG7nl1QDQ)
    * *Sonata para Violín y Piano (KV. 304)* — W.A. Mozart (Junio 2022): [Ver en YouTube](https://www.youtube.com/watch?v=WOvARdlh45Q)
    * *Salut d'Amour (to Carice)* — Edward Elgar (Diciembre 2022): [Ver en YouTube](https://www.youtube.com/watch?v=Bhm1K_2bTYQ)
    * *Concierto para Dos Violines (BWV 1043)* — J.S. Bach (Junio 2022): [Ver en YouTube](https://www.youtube.com/watch?v=j81yxB_dy_E)
    * *Opus 34, Primer Movimiento* — Oskar Rieding (Diciembre 2021): [Ver en YouTube](https://www.youtube.com/watch?v=35g-lyy-INw)

  ## Natación y Filantropía
  ---
  La natación ha sido un pilar fundamental de mi estilo de vida durante más de 5 años, fomentando capacidad aeróbica, claridad mental y resistencia.

  * **Aguas Abiertas e Impacto Social**: Entrenando activamente para una **semimaratón de 5 km en aguas abiertas** en apoyo a la investigación de la ELA (Esclerosis Lateral Amiotrófica) y a los pacientes afectados, uniendo deporte de fondo e impacto social.
