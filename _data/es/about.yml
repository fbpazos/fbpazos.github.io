content: |
  Soy **Ingeniero de IA y Líder Técnico** con doble titulación en **Matemáticas e Ingeniería Informática** (UPM, Nota Media 9.4/10) y **Máster en Matemáticas Aplicadas y Computacionales** (UC3M). Combino el rigor matemático con la ingeniería cloud-native para diseñar plataformas de inteligencia artificial deterministas y de nivel empresarial que resuelven desafíos operativos críticos.

  Actualmente en **DXC Technology**, lidero iniciativas de ingeniería en **orquestación Multi-Agente** (AutoGen, Google ADK, MCP), pipelines deterministas de IA Generativa para preventas técnicas (>95% de reducción de tiempo de ciclo) y sistemas automatizados de auditoría de cumplimiento SOX. Con la confianza directa de clientes empresariales y equipos multifuncionales, me especializo en traducir requisitos de negocio complejos en arquitecturas de IA auditables y de alto rendimiento, con estrictas puertas de calidad y gobernanza de tolerancia cero.

  Más allá de la ingeniería, cultivo una disciplina constante y resistencia mental a través del atletismo competitivo (<mark>CrossFit</mark>, <mark>Spartan Race</mark>, <mark>Hyrox</mark> y natación de resistencia en aguas abiertas) y más de 4 años como violinista orquestal internacional.

  **Competencias Principales:** <mark>Sistemas Multi-Agente</mark> <mark>IA Generativa y Arquitectura LLM</mark> <mark>Matemáticas Aplicadas</mark> <mark>Arquitectura Cloud Azure</mark> <mark>Python</mark> <mark>Gobernanza Empresarial y MLOps</mark>
