services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: fbpazos-portfolio:latest
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    command: bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --force_polling
