<header class="header-container">
  <div class="row">
    <div class="header-left">
      <h1>{{ site.name }}</h1>
      <h2>{{ include.ui.title | default: site.title }}</h2>
    </div>
    <div class="header-right">
      <div class="header-right-row">
        <ul class="icons">
          {%- if site.github_username -%}
            <li><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" title="GitHub"><i class="fab fa-github"></i></a></li>
          {%- endif -%}
          {%- if site.linkedin_username -%}
            <li><a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer" title="LinkedIn"><i class="fab fa-linkedin"></i></a></li>
          {%- endif -%}
        </ul>
        <div class="lang-switch" aria-label="Language selector">
          <a href="{{ '/' | relative_url }}" class="lang-btn {% if include.page_lang == 'en' %}active{% endif %}" title="English version">EN</a>
          <span class="lang-sep">/</span>
          <a href="{{ '/es/' | relative_url }}" class="lang-btn {% if include.page_lang == 'es' %}active{% endif %}" title="Versión en español">ES</a>
        </div>
      </div>
      <div class="header-contacts">
        {%- if site.email -%}
          <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
        {%- endif -%}
        {%- if site.phone -%}
          <p><a href="tel:{{ site.phone }}">{{ site.phone }}</a></p>
        {%- endif -%}
      </div>
    </div>
  </div>
</header>
